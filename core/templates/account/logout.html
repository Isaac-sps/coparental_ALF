{% extends "core/base.html" %}
{% block content %}
<div class="card shadow-sm mx-auto" style="max-width: 480px;">
  <div class="card-body p-4 text-center">
    <h2 class="mb-3">Cerrar sesión</h2>
    <p class="text-muted mb-4">¿Seguro que deseas cerrar sesión?</p>

    <form method="post" action="{% url 'account_logout' %}">
      {% csrf_token %}
      {{ redirect_field }}
      <button type="submit" class="btn btn-danger w-100 mb-2">Cerrar sesión</button>
    </form>
    <a href="{% url 'core:dashboard' %}" class="btn btn-outline-secondary w-100">Cancelar</a>
  </div>
</div>
{% endblock %}
