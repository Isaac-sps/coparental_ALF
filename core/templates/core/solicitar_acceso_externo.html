{% extends "core/base.html" %} {% block content %}
<h2>Solicitud de acceso externo</h2>

<p>Selecciona el grupo y tu rol profesional para solicitar acceso.</p>

<form method="post">
  {% csrf_token %}

  <label for="grupo_id">Grupo:</label>
  <select name="grupo_id" class="form-control">
    {% for g in grupos %}
    <option value="{{ g.id }}">{{ g.nombre }}</option>
    {% endfor %}
  </select>

  <label for="rol" class="mt-3">Rol profesional:</label>
  <select name="rol" class="form-control">
    <option value="medico">Médico</option>
    <option value="psicologo">Psicólogo</option>
    <option value="abogado">Abogado</option>
    <option value="tutor">Tutor</option>
    <option value="profesor">Profesor</option>
  </select>

  <button type="submit" class="btn btn-primary mt-3">Solicitar acceso</button>
</form>
{% endblock %}
