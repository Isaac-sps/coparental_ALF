{% extends "core/base.html" %} {% block content %}
<h2>Invitar a la otra persona</h2>
<p class="text-muted">
  Le enviaremos un correo con un enlace de invitación. Podrá abrirlo desde
  cualquier celular, tablet o computador con acceso a ese correo (Gmail u
  otro) para unirse al grupo.
</p>

<form method="post" class="mt-3">
  {% csrf_token %}
  <div class="mb-3">
    <label for="email" class="form-label"
      >Correo electrónico del coparental</label
    >
    <input type="email" name="email" id="email" class="form-control" required />
  </div>
  <button type="submit" class="btn btn-primary">Enviar invitación</button>
  <a href="{% url 'core:panel_grupo' %}" class="btn btn-link">Cancelar</a>
</form>
{% endblock %}
