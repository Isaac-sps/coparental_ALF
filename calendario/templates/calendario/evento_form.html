{% extends "core/base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<h2>{% if evento %}Editar evento{% else %}Nuevo evento{% endif %}</h2>
<form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button class="btn btn-primary" type="submit">Guardar</button>
</form>
{% endblock %}
